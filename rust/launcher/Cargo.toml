[package]
name = "mvsdsion-launcher"
version = "0.1.0"
edition = "2021"
description = "Starts MVSDsion fast: unpacks the program once per version, then starts it directly"
publish = false

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
